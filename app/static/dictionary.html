<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關鍵字字典管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif; background: #f5f7fa; color: #333; min-height: 100vh; padding: 2rem; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 0.5rem; color: #1a1a2e; font-size: 1.8rem; }
        .subtitle { text-align: center; color: #666; margin-bottom: 2rem; font-size: 0.95rem; }
        .back-link { display: inline-block; margin-bottom: 1.5rem; color: #4a90d9; text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }

        .tabs { display: flex; gap: 0; margin-bottom: 0; }
        .tab { padding: 0.7rem 1.5rem; background: #e8e8e8; border: 1px solid #ddd; border-bottom: none; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 0.9rem; color: #666; }
        .tab.active { background: #fff; color: #333; font-weight: 600; border-bottom: 1px solid #fff; position: relative; z-index: 1; }

        .card { background: #fff; border-radius: 0 12px 12px 12px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 1.5rem; border: 1px solid #ddd; border-top: none; }
        .card h2 { font-size: 1.05rem; margin-bottom: 0.8rem; color: #1a1a2e; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 上傳區 */
        .upload-area { border: 2px dashed #ccc; border-radius: 8px; padding: 2rem; text-align: center; cursor: pointer; transition: all 0.2s; background: #fafbfc; margin-bottom: 1rem; }
        .upload-area:hover { border-color: #4a90d9; background: #f0f7ff; }
        .upload-area .icon { font-size: 2.5rem; }
        .upload-area p { color: #666; margin-top: 0.3rem; font-size: 0.9rem; }

        .sheet-info { background: #f8f9fa; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; font-size: 0.85rem; }
        .sheet-info code { background: #e8f4fd; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.82rem; }

        .note-input { width: 100%; padding: 0.5rem 0.8rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; margin-bottom: 1rem; }
        .note-input:focus { outline: none; border-color: #4a90d9; }

        .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #4a90d9; color: #fff; }
        .btn-primary:hover { background: #357abd; }
        .btn-primary:disabled { background: #b0c4de; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #555; border: 1px solid #ddd; }
        .btn-secondary:hover { background: #e8f4fd; }

        .btn-row { display: flex; gap: 0.8rem; align-items: center; }

        /* 歷史 */
        .history-item { display: flex; align-items: center; padding: 0.7rem 0; border-bottom: 1px solid #f0f0f0; font-size: 0.85rem; }
        .history-item:last-child { border-bottom: none; }
        .history-item .info { flex: 1; }
        .history-item .info .name { font-weight: 600; }
        .history-item .info .meta { color: #888; font-size: 0.78rem; margin-top: 0.2rem; }
        .history-item .info .parsed { color: #4a90d9; font-size: 0.78rem; margin-top: 0.1rem; }

        /* 檢視字典 */
        .dict-section { margin-bottom: 1.5rem; }
        .dict-section h3 { font-size: 0.95rem; margin-bottom: 0.5rem; color: #1a1a2e; }
        .dict-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        .dict-table th, .dict-table td { padding: 0.4rem 0.6rem; border: 1px solid #eee; text-align: left; }
        .dict-table th { background: #f8f9fa; font-weight: 600; }
        .dict-table tr:nth-child(even) { background: #fafbfc; }

        .tag-list { display: flex; flex-wrap: wrap; gap: 0.3rem; }
        .tag { display: inline-block; padding: 0.2rem 0.5rem; background: #e8f4fd; border-radius: 12px; font-size: 0.78rem; }

        .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 0.8rem 1.5rem; background: #27ae60; color: #fff; border-radius: 8px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        .toast.error { background: #e74c3c; }

        .result-box { background: #f0fff0; border: 1px solid #b7e4b7; border-radius: 8px; padding: 1rem; margin-top: 1rem; font-size: 0.85rem; display: none; }
        .result-box.error { background: #fff0f0; border-color: #e4b7b7; }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back-link">← 回到主頁上傳文件</a>
    <h1>📚 關鍵字字典管理</h1>
    <p class="subtitle">上傳 Excel 字典檔一次更新所有過濾規則，或檢視目前生效的設定</p>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('upload')">上傳新字典</div>
        <div class="tab" onclick="switchTab('history')">已儲存字典</div>
        <div class="tab" onclick="switchTab('view')">檢視目前字典</div>
    </div>

    <!-- 上傳新字典 -->
    <div class="card">
        <div class="tab-content active" id="tab-upload">
            <h2>上傳新的關鍵字字典檔</h2>
            <div class="sheet-info">
                字典檔需包含分頁：<code>filter_keywords</code>、<code>stopwords</code>、<code>settings</code>（都是選填，有的就會更新）
            </div>

            <div class="upload-area" id="dict-upload-area">
                <div class="icon">📄</div>
                <p><strong>點擊或拖放 Excel 字典檔（.xlsx）</strong></p>
            </div>
            <input type="file" id="dict-file-input" accept=".xlsx" hidden>
            <p id="dict-file-name" style="font-size:0.85rem;color:#4a90d9;margin-bottom:0.8rem"></p>

            <input type="text" class="note-input" id="dict-note" placeholder="字典備註（可選），例如：2025Q2 更新版">

            <div class="btn-row">
                <button class="btn btn-primary" id="dict-upload-btn" disabled onclick="uploadDict()">上傳並套用</button>
                <a href="/api/dictionary/template" class="btn btn-secondary">📥 下載範本 Excel</a>
            </div>

            <div class="result-box" id="upload-result"></div>
        </div>

        <!-- 已儲存字典 -->
        <div class="tab-content" id="tab-history">
            <h2>已上傳的字典紀錄</h2>
            <div id="dict-history-list"><p style="color:#888;font-size:0.85rem">載入中...</p></div>
        </div>

        <!-- 檢視目前字典 -->
        <div class="tab-content" id="tab-view">
            <h2>目前生效的字典內容</h2>
            <div id="dict-current-content"><p style="color:#888;font-size:0.85rem">載入中...</p></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let selectedDictFile = null;

// Tab 切換
function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', t.textContent.includes(
            tab === 'upload' ? '上傳' : tab === 'history' ? '已儲存' : '檢視'
        ));
    });
    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');

    if (tab === 'history') loadDictHistory();
    if (tab === 'view') loadCurrentDict();
}

// 上傳區
const dictArea = document.getElementById('dict-upload-area');
const dictInput = document.getElementById('dict-file-input');

dictArea.addEventListener('click', () => dictInput.click());
dictArea.addEventListener('dragover', e => { e.preventDefault(); dictArea.style.borderColor = '#4a90d9'; });
dictArea.addEventListener('dragleave', () => { dictArea.style.borderColor = '#ccc'; });
dictArea.addEventListener('drop', e => {
    e.preventDefault();
    dictArea.style.borderColor = '#ccc';
    if (e.dataTransfer.files[0]) selectDictFile(e.dataTransfer.files[0]);
});
dictInput.addEventListener('change', () => { if (dictInput.files[0]) selectDictFile(dictInput.files[0]); });

function selectDictFile(file) {
    if (!file.name.toLowerCase().endsWith('.xlsx')) {
        showToast('請選擇 .xlsx 檔案', true);
        return;
    }
    selectedDictFile = file;
    document.getElementById('dict-file-name').textContent = `📄 ${file.name} (${(file.size/1024).toFixed(1)} KB)`;
    document.getElementById('dict-upload-btn').disabled = false;
}

async function uploadDict() {
    if (!selectedDictFile) return;

    const formData = new FormData();
    formData.append('file', selectedDictFile);
    formData.append('note', document.getElementById('dict-note').value);

    document.getElementById('dict-upload-btn').disabled = true;
    document.getElementById('dict-upload-btn').textContent = '上傳中...';

    try {
        const resp = await fetch('/api/dictionary/upload', { method: 'POST', body: formData });
        const data = await resp.json();
        const resultBox = document.getElementById('upload-result');

        if (data.error) {
            resultBox.className = 'result-box error';
            resultBox.style.display = 'block';
            resultBox.textContent = '❌ ' + data.error;
            showToast(data.error, true);
        } else {
            resultBox.className = 'result-box';
            resultBox.style.display = 'block';
            let info = '✅ 字典已套用！\n';
            for (const [key, val] of Object.entries(data.parsed || {})) {
                info += `\n• ${key}: ${val}`;
            }
            resultBox.textContent = info;
            showToast('字典上傳成功');
        }
    } catch (err) {
        showToast('上傳失敗: ' + err.message, true);
    }

    document.getElementById('dict-upload-btn').disabled = false;
    document.getElementById('dict-upload-btn').textContent = '上傳並套用';
}

// 歷史
async function loadDictHistory() {
    const resp = await fetch('/api/dictionary/history');
    const history = await resp.json();
    const container = document.getElementById('dict-history-list');

    if (!history.length) {
        container.innerHTML = '<p style="color:#888;font-size:0.85rem">還沒有上傳過字典</p>';
        return;
    }

    container.innerHTML = history.map(h => {
        const info = Object.entries(h.info || {}).map(([k,v]) => `${k}: ${v}`).join('、');
        return `
            <div class="history-item">
                <div class="info">
                    <div class="name">${h.original_name}</div>
                    <div class="meta">${h.time}${h.note ? ' — ' + h.note : ''}</div>
                    ${info ? `<div class="parsed">${info}</div>` : ''}
                </div>
            </div>
        `;
    }).join('');
}

// 檢視目前字典
async function loadCurrentDict() {
    const resp = await fetch('/api/dictionary/current');
    const data = await resp.json();
    const container = document.getElementById('dict-current-content');

    let html = '';

    // 過濾關鍵字
    const kws = data.filter_keywords || {};
    if (Object.keys(kws).length > 0) {
        html += '<div class="dict-section"><h3>🗑️ 過濾關鍵字</h3><table class="dict-table"><tr><th>類別</th><th>關鍵字</th></tr>';
        for (const [cat, words] of Object.entries(kws)) {
            html += `<tr><td>${cat}</td><td><div class="tag-list">${words.map(w => `<span class="tag">${w}</span>`).join('')}</div></td></tr>`;
        }
        html += '</table></div>';
    }

    // 停用詞
    const sw = data.stopwords || [];
    if (sw.length > 0) {
        html += `<div class="dict-section"><h3>🚫 停用詞（${sw.length} 個）</h3><div class="tag-list">${sw.map(w => `<span class="tag">${w}</span>`).join('')}</div></div>`;
    }

    // 設定
    const settings = data.filter_settings || {};
    if (Object.keys(settings).length > 0) {
        html += '<div class="dict-section"><h3>⚙️ 設定</h3><table class="dict-table"><tr><th>設定項</th><th>值</th></tr>';
        for (const [k, v] of Object.entries(settings)) {
            html += `<tr><td>${k}</td><td>${v}</td></tr>`;
        }
        html += '</table></div>';
    }

    if (!html) html = '<p style="color:#888">目前沒有任何設定</p>';
    container.innerHTML = html;
}

function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => toast.className = 'toast', 2500);
}
</script>
</body>
</html>
