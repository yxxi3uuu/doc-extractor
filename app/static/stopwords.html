<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>停用詞設定</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif; background: #f5f7fa; color: #333; min-height: 100vh; padding: 2rem; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 0.5rem; color: #1a1a2e; font-size: 1.8rem; }
        .subtitle { text-align: center; color: #666; margin-bottom: 2rem; font-size: 0.95rem; }
        .back-link { display: inline-block; margin-bottom: 1.5rem; color: #4a90d9; text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }
        .card { background: #fff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
        .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #1a1a2e; }

        .word-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; max-height: 300px; overflow-y: auto; }
        .tag { display: inline-flex; align-items: center; padding: 0.3rem 0.7rem; background: #fff3e0; border: 1px solid #ffe0b2; border-radius: 20px; font-size: 0.82rem; }
        .tag .remove { margin-left: 0.4rem; cursor: pointer; color: #e74c3c; font-weight: bold; }
        .tag .remove:hover { color: #c0392b; }

        .add-row { display: flex; gap: 0.5rem; }
        .add-row input { flex: 1; padding: 0.5rem 0.8rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; }
        .add-row input:focus { outline: none; border-color: #4a90d9; }
        .add-row button { padding: 0.5rem 1rem; background: #e67e22; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .add-row button:hover { background: #d35400; }

        .count { font-size: 0.8rem; color: #888; margin-bottom: 0.5rem; }

        .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 0.8rem 1.5rem; background: #27ae60; color: #fff; border-radius: 8px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back-link">← 回到主頁</a>
    <h1>🚫 停用詞設定</h1>
    <p class="subtitle">這些詞不會出現在自動產生的關鍵字裡。加上你覺得「太廢」的詞，關鍵字就會更精準。</p>

    <div class="card">
        <h2>新增停用詞</h2>
        <div class="add-row">
            <input type="text" id="new-word-input" placeholder="輸入要排除的詞，例如：總統、表示、認為" onkeydown="if(event.key==='Enter') addWord()">
            <button onclick="addWord()">加入</button>
        </div>
        <p style="font-size:0.78rem;color:#888;margin-top:0.5rem">💡 可以用空白或逗號一次加多個詞</p>
    </div>

    <div class="card">
        <h2>目前的自訂停用詞</h2>
        <p class="count" id="word-count"></p>
        <div class="word-tags" id="word-tags"></div>
        <p style="font-size:0.78rem;color:#888;margin-top:0.5rem">※ 程式內建已有 150+ 個基本停用詞，這裡只顯示你另外加的</p>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let words = [];

async function loadWords() {
    const resp = await fetch('/api/config/stopwords');
    words = await resp.json();
    render();
}

function render() {
    document.getElementById('word-count').textContent = `共 ${words.length} 個自訂停用詞`;
    document.getElementById('word-tags').innerHTML = words.map(w => `
        <span class="tag">${w}<span class="remove" onclick="removeWord('${w}')">✕</span></span>
    `).join('');
}

async function addWord() {
    const input = document.getElementById('new-word-input');
    const raw = input.value.trim();
    if (!raw) return;

    // 支援空白或逗號分隔多個詞
    const newWords = raw.split(/[,，\s]+/).filter(w => w.trim());
    for (const word of newWords) {
        const formData = new FormData();
        formData.append('word', word.trim());
        const resp = await fetch('/api/config/stopwords', { method: 'POST', body: formData });
        words = await resp.json();
    }
    input.value = '';
    render();
    showToast(`已新增 ${newWords.length} 個停用詞`);
}

async function removeWord(word) {
    const resp = await fetch(`/api/config/stopwords?word=${encodeURIComponent(word)}`, { method: 'DELETE' });
    words = await resp.json();
    render();
    showToast(`已移除「${word}」`);
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

loadWords();
</script>
</body>
</html>
