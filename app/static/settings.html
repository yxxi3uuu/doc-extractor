<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>過濾關鍵字設定</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: #f5f7fa; color: #333; min-height: 100vh; padding: 2rem;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 0.5rem; color: #1a1a2e; font-size: 1.8rem; }
        .subtitle { text-align: center; color: #666; margin-bottom: 2rem; font-size: 0.95rem; }
        .back-link { display: inline-block; margin-bottom: 1.5rem; color: #4a90d9; text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }

        .card {
            background: #fff; border-radius: 12px; padding: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 1.5rem;
        }
        .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #1a1a2e; display: flex; align-items: center; justify-content: space-between; }
        .card h2 .delete-cat { font-size: 0.8rem; color: #e74c3c; cursor: pointer; font-weight: normal; }
        .card h2 .delete-cat:hover { text-decoration: underline; }

        .keyword-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
        .tag {
            display: inline-flex; align-items: center; padding: 0.4rem 0.8rem;
            background: #e8f4fd; border: 1px solid #b8d4e8; border-radius: 20px; font-size: 0.85rem;
        }
        .tag .remove { margin-left: 0.5rem; cursor: pointer; color: #e74c3c; font-weight: bold; font-size: 0.9rem; }
        .tag .remove:hover { color: #c0392b; }

        .add-row { display: flex; gap: 0.5rem; }
        .add-row input {
            flex: 1; padding: 0.5rem 0.8rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem;
        }
        .add-row input:focus { outline: none; border-color: #4a90d9; }
        .add-row button {
            padding: 0.5rem 1rem; background: #4a90d9; color: #fff; border: none;
            border-radius: 6px; cursor: pointer; font-size: 0.9rem;
        }
        .add-row button:hover { background: #357abd; }

        .new-category { margin-top: 1rem; }
        .new-category .add-row input { max-width: 300px; }
        .new-category .add-row button { background: #27ae60; }
        .new-category .add-row button:hover { background: #219a52; }

        .toast {
            position: fixed; bottom: 2rem; right: 2rem; padding: 0.8rem 1.5rem;
            background: #27ae60; color: #fff; border-radius: 8px; font-size: 0.9rem;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← 回到主頁上傳文件</a>
        <h1>⚙️ 過濾關鍵字設定</h1>
        <p class="subtitle">這裡設定「哪些文章要被自動刪掉」。標題裡出現這些詞的文章，跑 Step 3 時就會被過濾掉。改完馬上生效，下次處理就會套用。</p>

        <div id="categories-container"></div>

        <div class="card new-category">
            <h2>想加一個新的過濾分類？</h2>
            <div class="add-row">
                <input type="text" id="new-cat-input" placeholder="取個名字，例如：娛樂八卦、股市投資">
                <button onclick="addCategory()">建立</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let keywordsData = {};

        async function loadKeywords() {
            const resp = await fetch('/api/config/keywords');
            keywordsData = await resp.json();
            render();
        }

        function render() {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';

            for (const [category, keywords] of Object.entries(keywordsData)) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h2>
                        ${category}
                        <span class="delete-cat" onclick="deleteCategory('${category}')">刪除此類別</span>
                    </h2>
                    <div class="keyword-tags">
                        ${keywords.map(kw => `
                            <span class="tag">
                                ${kw}
                                <span class="remove" onclick="removeKeyword('${category}', '${kw}')">✕</span>
                            </span>
                        `).join('')}
                    </div>
                    <div class="add-row">
                        <input type="text" placeholder="輸入新關鍵字" id="input-${category}" 
                               onkeydown="if(event.key==='Enter') addKeyword('${category}')">
                        <button onclick="addKeyword('${category}')">新增</button>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        async function addKeyword(category) {
            const input = document.getElementById(`input-${category}`);
            const keyword = input.value.trim();
            if (!keyword) return;

            const formData = new FormData();
            formData.append('category', category);
            formData.append('keyword', keyword);

            const resp = await fetch('/api/config/keywords', { method: 'POST', body: formData });
            keywordsData = await resp.json();
            input.value = '';
            render();
            showToast(`已新增「${keyword}」到「${category}」`);
        }

        async function removeKeyword(category, keyword) {
            const resp = await fetch(`/api/config/keywords?category=${encodeURIComponent(category)}&keyword=${encodeURIComponent(keyword)}`, {
                method: 'DELETE'
            });
            keywordsData = await resp.json();
            render();
            showToast(`已刪除「${keyword}」`);
        }

        async function addCategory() {
            const input = document.getElementById('new-cat-input');
            const category = input.value.trim();
            if (!category) return;

            const formData = new FormData();
            formData.append('category', category);

            const resp = await fetch('/api/config/category', { method: 'POST', body: formData });
            keywordsData = await resp.json();
            input.value = '';
            render();
            showToast(`已新增類別「${category}」`);
        }

        async function deleteCategory(category) {
            if (!confirm(`確定要刪除「${category}」整個類別嗎？`)) return;

            const resp = await fetch(`/api/config/category?category=${encodeURIComponent(category)}`, {
                method: 'DELETE'
            });
            keywordsData = await resp.json();
            render();
            showToast(`已刪除類別「${category}」`);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        loadKeywords();
    </script>
</body>
</html>
